# Rime moqi global settings
# encoding: utf-8

switches_engine:
  switches:
    - name: ascii_mode
      reset: 0
      states: [ 中文, 西文 ]
    - name: traditionalization
      states: [ 简体, 繁體 ]
    - name: emoji
      states: [ 💀, 😃 ]
      reset: 1
    - name: chaifen
      states: [ 拆无, 拆首 ]
      reset: 1
    - name: chaifen_all
      states: [ 拆无, 拆全 ]
      reset: 0
    - name: chinese_english
      states: [ 译无, 译有 ]
      reset: 0
    - name: mars
      states: [ 🈳, 🈵 ]
      reset: 0
    - name: ascii_punct
      states: [ ¥, $ ]
      reset: 0

  engine:
    processors:
      - lua_processor@*sbxlm.key_binder # 绑定按键
      - ascii_composer
      - recognizer
      - key_binder
      - speller
      - punctuator
      - selector
      - navigator
      - express_editor

    segmentors:
      - ascii_segmentor
      - matcher
      - affix_segmentor@add_user_dict
      - affix_segmentor@emojis
      - affix_segmentor@easy_en_simp
      - affix_segmentor@reverse_moqima
      - affix_segmentor@radical_flypy
      - affix_segmentor@reverse_stroke
      - abc_segmentor
      - punct_segmentor
      - fallback_segmentor

    translators:
      - punct_translator
      - table_translator@custom_phrase
      - table_translator@custom_phrase_3_code
      - table_translator@custom_phrase_super_3jian_no_conflict
      - table_translator@custom_phrase_super_4jian_no_conflict
      - table_translator@custom_phrase_super_1jian
      - table_translator@custom_phrase_super_2jian
      - table_translator@custom_phrase_super_3jian
      - table_translator@custom_phrase_kf
      - table_translator@custom_phrase_mqzg
      - lua_translator@*date_translator    # 时间、日期、星期
      - lua_translator@*lunar              # 农历
      - lua_translator@*unicode            # Unicode
      - lua_translator@*card_number
      - lua_translator@*number_translator  # 数字、金额大写
      - lua_translator@*calculator    # 计算器
      - table_translator@add_user_dict
      - table_translator@emojis
      - table_translator@easy_en_simp
      - script_translator@reverse_moqima
      - table_translator@radical_flypy
      - table_translator@reverse_stroke
      - script_translator
      - script_translator@user_dict_set
      - script_translator@add_user_dict
      
    filters:
      - lua_filter@*pro_comment_format                # 超级注释模块，支持错词错音提示、任意长度辅助码显示
      - lua_filter@*aux_lookup_filter                 # ` 引导辅助码筛选候选
      - lua_filter@*stick                             # 简码回显
      - lua_filter@*is_in_user_dict                   # 用户词典的词加上一个*
      - lua_filter@*moqi.jianma_show                  # 简码提示
      - reverse_lookup_filter@reverse_lookup
      - simplifier@emoji                              # Emoji
      - simplifier@chaifen
      - simplifier@chaifen_all
      - simplifier@chinese_english
      - simplifier@traditionalize                     # 简繁切换
      - simplifier@mars                               # 火星文
      - uniquifier

grammar:
  language: zh-moqi
  non_collocation_penalty: -4

octagram:
  disable:
    __patch:
      grammar: {}
  enable_for_sentence:
    __patch:
      grammar:
        language: zh-moqi
        non_collocation_penalty: -4
      translator/contextual_suggestions: true
      translator/max_sentences: 3
      translator/max_homophones: 4
      translator/max_homographs: 2

phrase:
  custom_phrase:
    dictionary: ""
    user_dict: custom_phrase/custom_phrase
    db_class: stabledb
    enable_completion: false
    enable_sentence: false
    initial_quality: 100000

  custom_phrase_super_3jian_no_conflict:
    dictionary: ""
    user_dict: custom_phrase/custom_phrase_super_3jian_no_conflict
    db_class: stabledb
    enable_sentence: false
    enable_completion: false
    initial_quality: -1

  custom_phrase_super_4jian_no_conflict:
    dictionary: ""
    user_dict: custom_phrase/custom_phrase_super_4jian_no_conflict
    db_class: stabledb
    enable_sentence: false
    enable_completion: false
    initial_quality: -1

  custom_phrase_kf:
    dictionary: ""
    user_dict: custom_phrase/custom_phrase_kf
    db_class: stabledb
    enable_sentence: false
    enable_completion: false
    initial_quality: -1

  custom_phrase_mqzg:
    dictionary: ""
    user_dict: custom_phrase/custom_phrase_mqzg
    db_class: stabledb
    enable_sentence: false
    enable_completion: false
    initial_quality: -1

  custom_phrase_super_1jian:
    dictionary: ""
    user_dict: custom_phrase/custom_phrase_super_1jian
    db_class: stabledb
    enable_sentence: false
    enable_completion: false
    initial_quality: -1

  custom_phrase_super_2jian:
    dictionary: ""
    user_dict: custom_phrase/custom_phrase_super_2jian
    db_class: stabledb
    enable_sentence: false
    enable_completion: false
    initial_quality: -1

  custom_phrase_super_3jian:
    dictionary: ""
    user_dict: custom_phrase/custom_phrase_super_3jian
    db_class: stabledb
    enable_sentence: false
    enable_completion: false
    initial_quality: -1

reverse:
  reverse_moqima:
    tag: reverse_moqima
    dictionary: reverse_moqima
    enable_completion: true
    prefix: "amq"
    suffix: "'"
    tips: 〔墨奇反查〕

  radical_flypy:
    tag: radical_flypy
    dictionary: radical_flypy
    enable_completion: true
    prefix: "az"
    suffix: "'"
    tips: 〔部件组字〕

  reverse_stroke:
    tag: reverse_stroke
    dictionary: stroke
    enable_completion: true
    prefix: "ab"
    suffix: "'"
    tips: 〔筆畫hspnz〕

  reverse_lookup:
    tags: [ reverse_moqima, radical_flypy, reverse_stroke ]
    overwrite_comment: true
    dictionary: moqi_wan.extended

opencc_config:
  chaifen:
    option_name: chaifen
    opencc_config: moqi_chaifen.json
    tips: char
    show_in_comment: true
    comment_format:
      - "xform/	/ /"

  chaifen_all:
    option_name: chaifen_all
    opencc_config: moqi_chaifen_all.json
    tips: char
    show_in_comment: true
    comment_format:
      - "xform/	/ /"

  chinese_english:
    option_name: chinese_english
    opencc_config: chinese_english.json
    tips: char
    comment_format:
      - "xform/-/ /"

  emoji:
    option_name: emoji
    opencc_config: emoji.json
    inherit_comment: false

  traditionalize:
    option_name: traditionalization
    opencc_config: s2t.json
    tips: none
    tags: [ abc, number, gregorian_to_lunar ]

  mars:
    opencc_config: martian.json
    option_name: mars

punctuator:
  punctuator:
    full_shape:
      __include: default:/punctuator/full_shape
    half_shape:
      __include: default:/punctuator/half_shape
    symbols:
      __include: symbols_caps_v:/symbols

guide:
  recognizer:
    patterns:
      uppercase: "^[A-Z].*$"
      punct: '^/([0-9]|10|[A-z]+)$'
      reverse_moqima: "^amq[A-Za-z]*$"
      radical_flypy: "^az[a-z]*'?$"
      reverse_stroke: "^ab[A-Za-z]*$"
      add_user_dict: "^ac[A-Za-z]*$"
      emojis: "^ae[a-z]*'?$"
      easy_en_simp: "^aw[a-z]*"
      card_number: "^C[0-9]+"
      unicode: "^U[a-f0-9]+"
      number: "^R[0-9]+[.]?[0-9]*"
      gregorian_to_lunar: "^N[0-9]{1,8}"

  emojis:
    tag: emojis
    dictionary: emoji
    enable_completion: true
    prefix: "ae"
    tips: " Emoji"

  easy_en_simp:
    tag: easy_en_simp
    dictionary: easy_en
    enable_completion: true
    enable_sentence: false
    prefix: "aw"
    tips: "英文单词（可去元音）"
    spelling_hints: 9
    comment_format:
      - xform/^.+$//

  calculator:
    trigger: V

  date_translator:
    date: date
    time: time
    week: week
    datetime: datetime
    timestamp: timestamp

  lunar: anl
  long_word_filter:
    count: 2
    idx: 1

big_char_and_user_dict:
  user_dict_set:
    dictionary: moqi_wan.extended
    initial_quality: 0
    enable_completion: false
    enable_sentence: false
    spelling_hints: 1
    comment_format:
      - "xform/(^|[ '])[^[]+[[]/$1/"
    enable_user_dict: true
    user_dict: user.custom.dict
    db_class: tabledb

  add_user_dict:
    tag: add_user_dict
    dictionary: moqi_wan.extended
    initial_quality: -1
    user_dict: user.custom.dict
    db_class: tabledb
    enable_charset_filter: false
    enable_completion: true
    enable_encoder: true
    enable_sentence: true
    enable_user_dict: true
    encode_commit_history: false
    preedit_format:
    comment_format:
      - "xform/(^|[ '])[^[]+[[]/$1/"
    prefix: "ac"
    tips: "〔自造词〕"
