name: Dict Pipeline CI/CD

on:
  push:
    branches: [main, master, moqiall]
    paths:
      - 'cn_dicts*/**'
      - 'scripts/**'
      - '.github/workflows/dict_ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'cn_dicts*/**'
      - 'scripts/**'
      - '.github/workflows/dict_ci.yml'
  workflow_dispatch:

jobs:
  clean-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest

      - name: Run Unit Tests
        run: |
          if [ -d "tests" ] && [ -n "$(ls -A tests 2>/dev/null)" ]; then
            pytest tests/ -v
          else
            echo "::notice::tests/ 目录不存在或为空，跳过单测"
          fi

      - name: Dry-Run Cleanup Report
        run: |
          python scripts/clean_dict.py --dry-run | tee dryrun.log

      - name: Execute Global Cleanup
        run: |
          python scripts/clean_dict.py

      - name: Check Source Drift
        run: |
          git diff --stat
          git diff --exit-code || {
            echo "::error::词库尚未在本地完成清洗提交！请在本地运行 'python scripts/clean_dict.py' 后重新提交。"
            exit 1
          }

      - name: Package Dictionaries
        run: |
          INCLUDE=""
          for d in cn_dicts cn_dicts_common cn_dicts_cell; do
            if [ -d "$d" ] && [ -n "$(ls -A "$d" 2>/dev/null)" ]; then
              INCLUDE="$INCLUDE $d"
            fi
          done

          if [ -z "$INCLUDE" ]; then
            echo "::error::未检测到任何可打包的词库目录"
            exit 1
          fi

          EXTRA=""
          if [ -f "README.md" ]; then
            EXTRA="README.md"
          fi

          zip -r dict_output.zip $INCLUDE $EXTRA -x '*.git*'

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rime-clean-dictionaries
          path: dict_output.zip
          retention-days: 30
