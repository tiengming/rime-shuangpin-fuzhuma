name: Clean, Validate and Artifacts

on:
  push:
    branches: [ main, master ]
    paths:
      - 'scripts/**'
      - 'cn_dicts/**'
      - '.github/workflows/dict_ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'scripts/**'
      - 'cn_dicts/**'
      - '.github/workflows/dict_ci.yml'

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest

      - name: Run Unit Tests
        run: |
          pytest tests/

      - name: Dry-Run Cleanup
        run: |
          python scripts/clean_dict.py --dir cn_dicts --dry-run

      - name: Execute Cleanup
        run: |
          python scripts/clean_dict.py --dir cn_dicts

      - name: Check for Uncommitted Drift
        run: |
          git diff --stat
          # 若期望 CI 检查提交一致性（如果不一致则报错提醒开发者本地未清洗），解除下行注释：
          # git diff --exit-code

      - name: Packaging Output
        run: |
          # 检查目录是否存在且非空，防止 zip 退出码报错
          if [ -d "cn_dicts" ] && [ "$(ls -A cn_dicts)" ]; then
            # 修正 zip 语法：排除模式 -x 必须放在最后
            zip -r dict_output.zip cn_dicts README.md -x '*.git*'
          else
            echo "[ERROR] cn_dicts 目录不存在或为空，取消打包"
            exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rime-clean-dictionaries
          path: dict_output.zip
          retention-days: 30
