name: Dict Pipeline CI/CD

on:
  push:
    branches:
      - moqiall
      - main
    paths:
      - 'cn_dicts/**'
      - 'cn_dicts_cell/**'
      - 'cn_dicts_common/**'
      - 'scripts/**'
      - '.github/workflows/dict_ci.yml'
  workflow_dispatch:

jobs:
  clean_and_lint:
    name: Clean, Validate & Package Dictionary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run Clean & Deduplication Script
        run: |
          python scripts/clean_dict.py --dirs cn_dicts cn_dicts_common cn_dicts_cell --min-threshold 2

      - name: Validate YAML Header Syntax
        run: |
          python -c "
          import yaml, glob

          def validate_header(filepath):
              header_lines = []
              with open(filepath, 'r', encoding='utf-8') as f:
                  for line in f:
                      header_lines.append(line)
                      if line.strip() == '...':
                          break
              yaml.safe_load(''.join(header_lines))

          for f in glob.glob('**/*.dict.yaml', recursive=True):
              try:
                  validate_header(f)
              except Exception as e:
                  print(f'❌ YAML Header Error in {f}: {e}')
                  exit(1)
          print('✅ 所有词库 YAML Header 校验通过！')
          "

      - name: Package Release Bundle
        run: |
          mkdir -p release_dist
          zip -r release_dist/rime-moqi-all-dicts.zip \
            $([ -d cn_dicts ] && echo "cn_dicts") \
            $([ -d cn_dicts_common ] && echo "cn_dicts_common") \
            $([ -d cn_dicts_cell ] && echo "cn_dicts_cell") \
            *.dict.yaml README.md -x "*.git*"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: moqiall-dict-package
          path: release_dist/rime-moqi-all-dicts.zip
