metadata:
  app_name: Xime
  app_version: ">=3.0.0"
  platform: android
  config_version: 1
  generator: "Xime Config Generator"
  modified_time: "2026-09-25"

xime_index:
  base_urls:
    - "https://cdn.jsdelivr.net/gh/ximeiorg/xime-index@master/"
    - "https://fastly.jsdelivr.net/gh/ximeiorg/xime-index@master/"
    - "https://index.ximei.me/"
    - "https://raw.githubusercontent.com/ximeiorg/xime-index/refs/heads/main/"

style:
  # 可切换：ink_ridge_moon / starry_night_voyage / milk_white_silver_moon / titanium_order / cobalt_pulse
  color_scheme: milk_white_silver_moon

# ══════════════════════════════════════════════════════════
#  五套主题配色
# ══════════════════════════════════════════════════════════
color_schemes:
  # ── 1. 墨岭月色 ──
  ink_ridge_moon:
    name: "墨岭月色"
    primary_color: 0x5B6B8C
    keyboard_background:
      type: gradient
      colors: [0xE9EDF4, 0xD9E0EE]
      colors_dark: [0x0B0F1A, 0x141B2C]
      angle: 135
    key_bg_color: 0xF5F7FB
    key_bg_color_dark: 0x28FFFFFF
    key_text_color: 0x2B3446
    key_text_color_dark: 0xDCE3F2
    candidate_text_color: 0x2B3446
    candidate_text_color_dark: 0xDCE3F2

  # ── 2. 星野夜航 ──
  starry_night_voyage:
    name: "星野夜航"
    primary_color: 0x6D5BD0
    keyboard_background:
      type: gradient
      colors: [0xF0EEFB, 0xE3DFF7]
      colors_dark: [0x0F0C1E, 0x191430]
      angle: 135
    key_bg_color: 0xFAF9FF
    key_bg_color_dark: 0x27FFFFFF
    key_text_color: 0x38305E
    key_text_color_dark: 0xE3DEF7
    candidate_text_color: 0x38305E
    candidate_text_color_dark: 0xE3DEF7

  # ── 3. 奶白银月 ──
  # 意象：奶白、银灰、月光紫灰。干净、柔和、低饱和，偏现代家居感。
  milk_white_silver_moon:
    name: "奶白银月"
    primary_color: 0xA7A3B8
    keyboard_background:
      type: gradient
      colors: [0xFBFAF7, 0xF0EEE9]
      colors_dark: [0x141318, 0x1E1C24]
      angle: 135
    key_bg_color: 0xFFFFFF
    key_bg_color_dark: 0x2AFFFFFF
    key_text_color: 0x3A3742
    key_text_color_dark: 0xEDEAF2
    candidate_text_color: 0x3A3742
    candidate_text_color_dark: 0xEDEAF2

  # ── 4. 钛银秩序 ──
  # 意象：钛金属、冷灰、精密秩序。现代极简，适合长时间输入。
  titanium_order:
    name: "钛银秩序"
    primary_color: 0x7C8798
    keyboard_background:
      type: gradient
      colors: [0xF4F6F8, 0xE6EAEF]
      colors_dark: [0x0E1116, 0x171C24]
      angle: 135
    key_bg_color: 0xFCFDFE
    key_bg_color_dark: 0x26FFFFFF
    key_text_color: 0x2B313B
    key_text_color_dark: 0xE4E9F0
    candidate_text_color: 0x2B313B
    candidate_text_color_dark: 0xE4E9F0

  # ── 5. 钴蓝脉冲 ──
  # 意象：钴蓝、电光、冷静科技感。不是青色，偏纯蓝与蓝紫。
  cobalt_pulse:
    name: "钴蓝脉冲"
    primary_color: 0x3D5AFE
    keyboard_background:
      type: gradient
      colors: [0xF1F4FF, 0xE1E7FF]
      colors_dark: [0x080B1A, 0x111735]
      angle: 135
    key_bg_color: 0xFAFBFF
    key_bg_color_dark: 0x26FFFFFF
    key_text_color: 0x1E2440
    key_text_color_dark: 0xE3E8FF
    candidate_text_color: 0x1E2440
    candidate_text_color_dark: 0xE3E8FF

keyboard:
  # ── 全局兜底颜色 ──
  colors:
    keyboard_bg_color: 0xE3E4E8
    keyboard_bg_color_dark: 0x202020
    key_bg_color: 0xFFFFFF
    key_bg_color_dark: 0x4A4A4A
    candidate_bar_bg_color: 0xE3E4E8
    candidate_bar_bg_color_dark: 0x202020
    key_text_color: 0x202124
    key_text_color_dark: 0xE8EAED
    candidate_text_color: 0x202124
    candidate_text_color_dark: 0xE8EAED

  key:
    corner_radius: 8

  shadow:
    enabled: true
    elevation: 2

  # ══════════════ 中文 26 键（小鹤双拼 · 适配墨奇）══════════════
  qwerty:
    button_layout: compact
    layout:
      rows:
        - ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0"]
        - [q, w, e, r, t, y, u, i, o, p]
        - [a, s, d, f, g, h, j, k, l]
        - [shift, z, x, c, v, b, n, m, delete]
        - [mode_change, comma, space, earth, enter]
    keys:
      # ── 数字行：点按数字 / 下滑 PC 符号 / 长按额外符号 ──
      "1": { tap: "1", swipe_down: "!", long_press: { display: "bubble", values: ["1", "°", "¡"] } }
      "2": { tap: "2", swipe_down: "@", long_press: { display: "bubble", values: ["2", "±", "≠"] } }
      "3": { tap: "3", swipe_down: "#", long_press: { display: "bubble", values: ["3", "§", "¶"] } }
      "4": { tap: "4", swipe_down: "$", long_press: { display: "bubble", values: ["4", "€", "¢"] } }
      "5": { tap: "5", swipe_down: "%", long_press: { display: "bubble", values: ["5", "£", "¥"] } }
      "6": { tap: "6", swipe_down: "^", long_press: { display: "bubble", values: ["6", "×", "÷"] } }
      "7": { tap: "7", swipe_down: "&", long_press: { display: "bubble", values: ["7", "•", "·"] } }
      "8": { tap: "8", swipe_down: "*", long_press: { display: "bubble", values: ["8", "‰", "∞"] } }
      "9": { tap: "9", swipe_down: "(", long_press: { display: "bubble", values: ["9", "「", "」"] } }
      "0": { tap: "0", swipe_down: ")", long_press: { display: "bubble", values: ["0", "【", "】"] } }

      # ── 第一行：上滑改为不与数字行重复的符号 / 下滑小鹤韵母提示 ──
      q: { tap: "q", swipe_up: '`', swipe_down: { label: "iu", action: "none", display: "key" }, long_press: { display: "bubble", values: ["q", "Q"] } }
      w: { tap: "w", swipe_up: "|", swipe_down: { label: "ei", action: "none", display: "key" }, long_press: { display: "bubble", values: ["w", "W"] } }
      e: { tap: "e", swipe_up: "€", swipe_down: { label: "e", action: "none", display: "key" }, long_press: { display: "bubble", values: ["e", "E", "è", "é", "ê", "ë"] } }
      r: { tap: "r", swipe_up: "£", swipe_down: { label: "uan", action: "none", display: "key" }, long_press: { display: "bubble", values: ["r", "R"] } }
      t: { tap: "t", swipe_up: "¥", swipe_down: { label: "ue\nve", action: "none", display: "key" }, long_press: { display: "bubble", values: ["t", "T"] } }
      y: { tap: "y", swipe_up: "•", swipe_down: { label: "un", action: "none", display: "key" }, long_press: { display: "bubble", values: ["y", "Y", "ÿ"] } }
      u: { tap: "u", swipe_up: "×", swipe_down: { label: "sh\nu", action: "none", display: "key" }, long_press: { display: "bubble", values: ["u", "U", "ù", "ú", "û", "ü"] } }
      i: { tap: "i", swipe_up: "÷", swipe_down: { label: "ch\ni", action: "none", display: "key" }, long_press: { display: "bubble", values: ["i", "I", "ì", "í", "î", "ï"] } }
      o: { tap: "o", swipe_up: "「", swipe_down: { label: "o\nuo", action: "none", display: "key" }, long_press: { display: "bubble", values: ["o", "O", "ò", "ó", "ô", "õ", "ö", "ø"] } }
      p: { tap: "p", swipe_up: "」", swipe_down: { label: "ie", action: "none", display: "key" }, long_press: { display: "bubble", values: ["p", "P"] } }

      # ── 第二行 ──
      a: { tap: "a", swipe_up: "～", swipe_down: { label: "a", action: "none", display: "key" }, long_press: { display: "bubble", values: ["a", "A", "à", "á", "â", "ã", "ä", "å", "æ"] } }
      s: { tap: "s", swipe_up: "／", swipe_down: { label: "iong\nong", action: "none", display: "key" }, long_press: { display: "bubble", values: ["s", "S", "ß"] } }
      d: { tap: "d", swipe_up: "：", swipe_down: { label: "ai", action: "none", display: "key" }, long_press: { display: "bubble", values: ["d", "D"] } }
      f: { tap: "f", swipe_up: "；", swipe_down: { label: "en", action: "none", display: "key" }, long_press: { display: "bubble", values: ["f", "F"] } }
      g: { tap: "g", swipe_up: "“", swipe_down: { label: "eng", action: "none", display: "key" }, long_press: { display: "bubble", values: ["g", "G"] } }
      h: { tap: "h", swipe_up: "”", swipe_down: { label: "ang", action: "none", display: "key" }, long_press: { display: "bubble", values: ["h", "H"] } }
      j: { tap: "j", swipe_up: "—", swipe_down: { label: "an", action: "none", display: "key" }, long_press: { display: "bubble", values: ["j", "J"] } }
      k: { tap: "k", swipe_up: "【", swipe_down: { label: "ing\nuai", action: "none", display: "key" }, long_press: { display: "bubble", values: ["k", "K"] } }
      l: { tap: "l", swipe_up: "】", swipe_down: { label: "iang\nuang", action: "none", display: "key" }, long_press: { display: "bubble", values: ["l", "L"] } }

      # ── 第三行 ──
      z: { tap: "z", swipe_up: "·", swipe_down: { label: "ou", action: "none", display: "key" }, long_press: { display: "bubble", values: ["z", "Z"] } }
      x: { tap: "x", swipe_up: "《", swipe_down: { label: "ia\nua", action: "none", display: "key" }, long_press: { display: "bubble", values: ["x", "X"] } }
      c: { tap: "c", swipe_up: "》", swipe_down: { label: "ao", action: "none", display: "key" }, long_press: { display: "bubble", values: ["c", "C", "ç"] } }
      v: { tap: "v", swipe_up: "？", swipe_down: { label: "zh\nui\nv", action: "none", display: "key" }, long_press: { display: "bubble", values: ["v", "V"] } }
      b: { tap: "b", swipe_up: "!", swipe_down: { label: "in", action: "none", display: "key" }, long_press: { display: "bubble", values: ["b", "B"] } }
      n: { tap: "n", swipe_up: "°", swipe_down: { label: "iao", action: "none", display: "key" }, long_press: { display: "bubble", values: ["n", "N", "ñ"] } }
      m: { tap: "m", swipe_up: "＝", swipe_down: { label: "ian", action: "none", display: "key" }, long_press: { display: "bubble", values: ["m", "M"] } }

      # ── 第四行：功能键 ──
      shift: { width: 1.4, tap: { action: command, value: shift_single }, double_tap: { action: command, value: shift_caps } }
      delete: { width: 1.4, tap: { action: delete }, long_press: { values: [ { action: delete, repeat: true } ] }, swipe_up: { action: clear_all, label: "上滑清空" }, swipe_down: { action: undo_clear, label: "下滑撤回" } }
      mode_change: { width: 1.2, tap: { action: command, value: mode_change }, long_press: { display: bubble, values: [ { label: number, action: command, value: mode_change_number }, { label: common_symbol, action: command, value: mode_change_common_symbol } ] } }
      space: { width: 3, tap: { action: space }, double_tap: { action: repeat_space, value: 5 }, long_press: { values: [ { action: voice } ] } }
      enter: { width: 1.2, tap: { action: enter } }
      comma: { tap: { label: "，", value: "," }, swipe_up: { label: "。", value: "." }, long_press: { display: "bubble", values: [",", ".", "?", "!", "、", "…"] } }
      earth: { tap: { label: "@language", action: toggle_ascii }, long_press: { display: "bubble", values: [ { label: "选择输入法", action: command, value: show_ime_picker } ] } }

  # ══════════════ 英文 26 键 ══════════════
  qwerty_en:
    button_layout: standard
    layout:
      rows:
        - ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0"]
        - [q, w, e, r, t, y, u, i, o, p]
        - [a, s, d, f, g, h, j, k, l]
        - [shift, z, x, c, v, b, n, m, delete]
        - [mode_change, comma, space, earth, enter]
    keys:
      # ── 数字行：点按数字 / 下滑 PC 符号 / 长按额外符号 ──
      "1": { tap: "1", swipe_down: "!", long_press: { display: "bubble", values: ["1", "°", "¡"] } }
      "2": { tap: "2", swipe_down: "@", long_press: { display: "bubble", values: ["2", "±", "≠"] } }
      "3": { tap: "3", swipe_down: "#", long_press: { display: "bubble", values: ["3", "§", "¶"] } }
      "4": { tap: "4", swipe_down: "$", long_press: { display: "bubble", values: ["4", "€", "¢"] } }
      "5": { tap: "5", swipe_down: "%", long_press: { display: "bubble", values: ["5", "£", "¥"] } }
      "6": { tap: "6", swipe_down: "^", long_press: { display: "bubble", values: ["6", "×", "÷"] } }
      "7": { tap: "7", swipe_down: "&", long_press: { display: "bubble", values: ["7", "•", "·"] } }
      "8": { tap: "8", swipe_down: "*", long_press: { display: "bubble", values: ["8", "‰", "∞"] } }
      "9": { tap: "9", swipe_down: "(", long_press: { display: "bubble", values: ["9", "「", "」"] } }
      "0": { tap: "0", swipe_down: ")", long_press: { display: "bubble", values: ["0", "【", "】"] } }

      # ── 第一行：上滑改为不与数字行重复的符号 ──
      q: { tap: "q", swipe_up: '`', long_press: { display: "bubble", values: ["q", "Q"] } }
      w: { tap: "w", swipe_up: "|", long_press: { display: "bubble", values: ["w", "W"] } }
      e: { tap: "e", swipe_up: "€", long_press: { display: "bubble", values: ["e", "E"] } }
      r: { tap: "r", swipe_up: "£", long_press: { display: "bubble", values: ["r", "R"] } }
      t: { tap: "t", swipe_up: "¥", long_press: { display: "bubble", values: ["t", "T"] } }
      y: { tap: "y", swipe_up: "•", long_press: { display: "bubble", values: ["y", "Y"] } }
      u: { tap: "u", swipe_up: "×", long_press: { display: "bubble", values: ["u", "U"] } }
      i: { tap: "i", swipe_up: "÷", long_press: { display: "bubble", values: ["i", "I"] } }
      o: { tap: "o", swipe_up: "「", long_press: { display: "bubble", values: ["o", "O"] } }
      p: { tap: "p", swipe_up: "」", long_press: { display: "bubble", values: ["p", "P"] } }

      # ── 第二行：上滑符号 / 下滑编辑快捷键 ──
      a: { tap: "a", swipe_up: "~", swipe_down: { label: "全选", action: "select_all", display: "key" }, long_press: { display: "bubble", values: ["a", "A"] } }
      s: { tap: "s", swipe_up: "/", swipe_down: { label: "清空", action: "command", value: "clear_composition", display: "key" }, long_press: { display: "bubble", values: ["s", "S"] } }
      d: { tap: "d", swipe_up: ":", swipe_down: { label: "重试", action: "repeat", display: "key" }, long_press: { display: "bubble", values: ["d", "D"] } }
      f: { tap: "f", swipe_up: ";", long_press: { display: "bubble", values: ["f", "F"] } }
      g: { tap: "g", swipe_up: "\"", long_press: { display: "bubble", values: ["g", "G"] } }
      h: { tap: "h", swipe_up: "'", long_press: { display: "bubble", values: ["h", "H"] } }
      j: { tap: "j", swipe_up: "-", long_press: { display: "bubble", values: ["j", "J"] } }
      k: { tap: "k", swipe_up: "_", long_press: { display: "bubble", values: ["k", "K"] } }
      l: { tap: "l", swipe_up: "=", long_press: { display: "bubble", values: ["l", "L"] } }

      # ── 第三行：上滑成对括号 / 下滑编辑快捷键 ──
      z: { tap: "z", swipe_up: "[", swipe_down: { label: "撤销", action: "undo", display: "key" }, long_press: { display: "bubble", values: ["z", "Z"] } }
      x: { tap: "x", swipe_up: "]", swipe_down: { label: "剪切", action: "cut", display: "key" }, long_press: { display: "bubble", values: ["x", "X"] } }
      c: { tap: "c", swipe_up: "{", swipe_down: { label: "复制", action: "copy", display: "key" }, long_press: { display: "bubble", values: ["c", "C", "ç"] } }
      v: { tap: "v", swipe_up: "}", swipe_down: { label: "粘贴", action: "paste", display: "key" }, long_press: { display: "bubble", values: ["v", "V"] } }
      b: { tap: "b", swipe_up: "<", swipe_down: { label: "换行", action: "commit", value: "\n", display: "key" }, long_press: { display: "bubble", values: ["b", "B"] } }
      n: { tap: "n", swipe_up: ">", swipe_down: { label: "段首", action: "line_start", display: "key" }, long_press: { display: "bubble", values: ["n", "N"] } }
      m: { tap: "m", swipe_up: "?", swipe_down: { label: "段尾", action: "line_end", display: "key" }, long_press: { display: "bubble", values: ["m", "M"] } }

      # ── 第四行：功能键 ──
      shift: { width: 1.4, tap: { action: command, value: shift_single }, double_tap: { action: command, value: shift_caps } }
      delete: { width: 1.4, tap: { action: delete }, long_press: { values: [ { action: delete, repeat: true } ] }, swipe_up: { action: clear_all, label: "上滑清空" }, swipe_down: { action: undo_clear, label: "下滑撤回" } }
      mode_change: { width: 1.2, tap: { action: command, value: mode_change }, long_press: { display: bubble, values: [ { label: number, action: command, value: mode_change_number }, { label: common_symbol, action: command, value: mode_change_common_symbol } ] } }
      space: { width: 3, tap: { action: space }, double_tap: { action: repeat_space, value: 5 }, long_press: { values: [ { action: voice } ] } }
      enter: { width: 1.2, tap: { action: enter } }
      comma: { tap: { label: ",", value: "," }, swipe_up: { label: ".", value: "." } }
      earth: { tap: { label: "@language", action: toggle_ascii }, long_press: { display: "bubble", values: [ { label: "选择输入法", action: command, value: show_ime_picker } ] } }